spring:
  datasource:
    url: ${DB_FOODSNDRINKS_URL:jdbc:mysql://localhost:3306/foodsndrinks?useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
#  jpa:
#    hibernate:
#      ddl-auto: validate # Validate schema; rely on Flyway migrations for changes
#    show-sql: true # Print SQL queries to console for easy debugging
#    properties:
#      hibernate:
#        format_sql: true
  # Giới hạn upload (spring.servlet.multipart.*) khai báo chung trong application.yml

# Customize logging for Dev environment (console output)
logging:
  level:
    root: INFO
    com.huuhv.foodsndrinks: DEBUG # Show detailed logs for application code

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches # Expose necessary endpoints
  endpoint:
    health:
      show-details: when-authorized # Show health details only for authenticated admins
app:
  security:
    remember-me-key: ${REMEMBER_ME_KEY:${random.value}${random.value}}
    attempt-limits:
      # Khoá HMAC băm key của bộ đếm chống brute-force (bảng attempt_limits). Không đặt thì sinh ngẫu nhiên 256 bit mỗi
      # khi context khởi động → bộ đếm/khoá cũ không còn khớp sau restart (dev chấp nhận được; test mỗi lần chạy có bộ
      # đếm riêng). Prod bắt buộc đặt và mọi instance dùng chung.
      key-secret: ${ATTEMPT_LIMITS_KEY_SECRET:${random.value}${random.value}}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
jwt:
  # Không đặt JWT_SECRET thì tự sinh khoá ngẫu nhiên: mỗi ${random.value} là 16 byte từ SecureRandom (Spring Boot 4),
  # ghép 2 lần = 256 bit, đủ cho HS256 và quy tắc "secret >= 256 bit". Không ai biết trước khoá ký, đổi lại token cũ
  # hết hiệu lực mỗi khi context khởi động lại — cả restart JVM lẫn hot restart của spring-boot-devtools.
  # Muốn giữ token qua các lần reload thì đặt JWT_SECRET trong .env. Prod bắt buộc đặt JWT_SECRET.
  secret: ${JWT_SECRET:${random.value}${random.value}}
  expiration: 3600000 # 1 hour

# Bật tính năng Swagger UI
springdoc:
  swagger-ui:
    enabled: true
    # Thay đổi đường dẫn mặc định (thay vì /swagger-ui.html)
    path: /api-docs/swagger
  # Đường dẫn chứa file JSON cấu hình
  api-docs:
    path: /api/v1/api-docs
  # Gom nhóm các API theo package để Document gọn gàng hơn
  packages-to-scan: com.huuhv.foodsndrinks.controller.api
