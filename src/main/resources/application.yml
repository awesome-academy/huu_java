spring:
  application:
    name: foodsndrinks
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} # Change to 'prod' when deploying to a real server
  config:
    # Secret cho môi trường local nằm trong file .env (git-ignore, mẫu ở .env.example) ở thư mục chạy app.
    # Biến môi trường của hệ điều hành / container vẫn được ưu tiên hơn giá trị trong .env.
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Áp dụng mọi profile (prod trước đây dùng mặc định của Spring). Ảnh sản phẩm/avatar: tối đa 5MB/file, 25MB/request
      max-file-size: 5MB
      max-request-size: 25MB
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:587}
    # Không đặt secret thật làm giá trị mặc định — khai báo trong .env hoặc biến môi trường
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Social login (see login.html "Đăng nhập bằng..." buttons). Client id/secret come from each
  # provider's developer console — set the real values via env vars before going live; the
  # "changeme-*" defaults just let the app boot without them configured.
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:changeme-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:changeme-google-client-secret}
            scope: openid, profile, email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:changeme-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:changeme-facebook-client-secret}
            scope: public_profile, email
          twitter:
            client-id: ${TWITTER_CLIENT_ID:changeme-twitter-client-id}
            client-secret: ${TWITTER_CLIENT_SECRET:changeme-twitter-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_basic
            scope: users.read, tweet.read
        provider:
          google:
            # Google verifies email ownership, so use it as the account-matching / principal name key
            user-name-attribute: email
          facebook:
            # Spring's Facebook default only requests id,name,email — add the profile picture too
            user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
          twitter:
            # Twitter/X isn't one of Spring's built-in providers (CommonOAuth2Provider) — fully manual.
            # Its OAuth2 authorization server also mandates PKCE regardless of client type (see
            # SecurityConfig#pkceAuthorizationRequestResolver).
            authorization-uri: https://twitter.com/i/oauth2/authorize
            token-uri: https://api.twitter.com/2/oauth2/token
            # user.fields=profile_image_url so the response includes an avatar URL
            user-info-uri: https://api.twitter.com/2/users/me?user.fields=profile_image_url
            # The response nests every field under a top-level "data" object — see
            # CustomOAuth2UserService, which unwraps it. "data" itself is just used to satisfy
            # DefaultOAuth2UserService's "name attribute must exist" check.
            user-name-attribute: data

server:
  port: 8080 # Default port
  servlet:
    session:
      timeout: 30m # Session không hoạt động quá 30 phút thì hết hạn (remember-me vẫn đăng nhập lại được)
      cookie:
        http-only: true   # JS không đọc được JSESSIONID
        same-site: lax    # Không gửi kèm request POST/iframe từ site khác (thêm một lớp ngoài CSRF token)
        # Chỉ gửi qua HTTPS. Dev (http://localhost) để false; prod mặc định true (application-prod.yml)
        secure: ${SESSION_COOKIE_SECURE:false}

# Secret/thời hạn đặt theo profile (application-dev.yml / application-prod.yml). iss/aud không phải secret: token chỉ
# hợp lệ khi khớp cả hai — đổi giá trị làm mọi token đã cấp hết hiệu lực.
jwt:
  issuer: ${JWT_ISSUER:foodsndrinks}
  audience: ${JWT_AUDIENCE:foodsndrinks-api}

logging:
  level:
    # Cảnh báo "Global AuthenticationManager configured with an AuthenticationProvider bean" là chủ ý: bean
    # LoginAttemptAwareAuthenticationProvider (SecurityConfig) thay provider Spring tự tạo để chống brute-force
    # Ngoặc vuông: tên logger có '$', không bọc thì Spring Boot bỏ ký tự này khi bind key của map
    "[org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer$InitializeUserDetailsManagerConfigurer]": ERROR

app:
  cors:
    # Origin (đầy đủ scheme://host[:port], cách nhau bởi dấu phẩy) được gọi /api/** từ trình duyệt. Rỗng = chỉ same-origin.
    # Không chấp nhận '*' (app không khởi động).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Định danh instance khi chạy nhiều instance sau load balancer: in trong mỗi dòng log, là field service.node.name
  # của audit.log, và (profile prod) là tên thư mục log riêng logs/<instance-id>/ để các instance không ghi chung file.
  # Mặc định lấy hostname (container Docker/pod K8s có hostname riêng); đặt INSTANCE_ID để dùng tên cố định, dễ đọc.
  instance-id: ${INSTANCE_ID:${HOSTNAME:${COMPUTERNAME:local}}}
  security:
    # Chống brute-force (form + API, bộ đếm trong bộ nhớ — chỉ đúng khi chạy 1 instance): sai max-failures lần trong
    # window (tính từ lần sai đầu tiên) với cùng tên đăng nhập → khoá tên đó lock-duration
    login-attempts:
      max-failures: 5
      window: 15m
      lock-duration: 15m
    password:
      # Từ chối mật khẩu mới nằm trong danh sách bị lộ (Pwned Passwords, chỉ gửi 5 ký tự đầu SHA-1);
      # dịch vụ lỗi/timeout thì cho qua và ghi WARN
      breach-check-enabled: ${PASSWORD_BREACH_CHECK_ENABLED:true}
  notification:
    admin-email: ${ADMIN_NOTIFY_EMAIL:admin@example.com}
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
      enabled: ${SLACK_NOTIFY_ENABLED:true}
    mail:
      enabled: ${MAIL_NOTIFY_ENABLED:true}
    statistics:
      # 23h ngày cuối tháng, theo múi giờ JVM (TZ/APP_TZ). Không khai báo zone riêng: OrderStatisticsScheduler tính
      # tháng bằng LocalDate.now() (múi giờ JVM), cron phải chạy cùng múi giờ đó thì mới lấy đúng tháng.
      cron: ${ORDER_STATS_CRON:0 0 23 L * *}
