# Cấu hình address/retry/dead-letter của broker Artemis — NGUỒN DUY NHẤT, dùng chung cho:
#   - broker embedded (dev/test): config/ArtemisEmbeddedConfig nạp file này (app.jms.embedded-broker-properties)
#   - broker riêng của docker compose: mount vào container và nạp bằng `artemis run --properties` mỗi lần khởi động
#   - broker prod: phải nạp đúng file này (README, mục Messaging)
# Cú pháp "broker properties" của Artemis (khoá theo tên thuộc tính Java của Configuration/AddressSettings). Khoá sai:
# broker embedded không khởi động được (ArtemisEmbeddedConfig đọc status), broker riêng chỉ ghi log và bỏ qua →
# sửa file này thì chạy ArtemisEmbeddedConfigTest. Tên address phải khớp service/messaging/Destinations.
# Retry nằm hoàn toàn ở broker, không retry trong code: listener ném exception → rollback → broker giao lại sau
# redeliveryDelay (nhân redeliveryMultiplier, tối đa maxRedeliveryDelay); quá maxDeliveryAttempts → deadLetterAddress.

# ---- order.placed: topic thông báo đơn hàng mới (mỗi kênh thông báo là một shared durable subscription) ----
addressConfigurations."order.placed".routingTypes=MULTICAST
# Queue của từng shared durable subscription (tên = tên subscription, Destinations.ORDER_PLACED_*_SUBSCRIPTION) tạo sẵn
# khi broker khởi động: nếu chỉ do listener tạo lúc đăng ký lần đầu thì message gửi trước đó (app vừa khởi động, broker
# mới) không có queue nào nhận → broker BỎ, trong khi outbox đã ghi SENT. Thêm kênh thông báo = thêm queue ở đây.
addressConfigurations."order.placed".queueConfigs."order-placed-email".address=order.placed
addressConfigurations."order.placed".queueConfigs."order-placed-email".routingType=MULTICAST
addressConfigurations."order.placed".queueConfigs."order-placed-email".durable=true
addressConfigurations."order.placed".queueConfigs."order-placed-slack".address=order.placed
addressConfigurations."order.placed".queueConfigs."order-placed-slack".routingType=MULTICAST
addressConfigurations."order.placed".queueConfigs."order-placed-slack".durable=true
# 5 lần giao: chờ 2s, 4s, 8s, 16s giữa các lần (~30s) rồi vào DLQ.order-placed
addressSettings."order.placed".maxDeliveryAttempts=5
addressSettings."order.placed".redeliveryDelay=2000
addressSettings."order.placed".redeliveryMultiplier=2.0
addressSettings."order.placed".maxRedeliveryDelay=30000
addressSettings."order.placed".deadLetterAddress=DLQ.order-placed
# Address đầy (vượt global-max-size, hoặc đĩa vượt max-disk-usage — khi đó PAGE mặc định cũng chặn producer) thì TỪ CHỐI
# gửi thay vì chặn: client Artemis chờ credit không có timeout, thread gửi (outbox-*, sched-*) sẽ treo vô thời hạn và giữ
# connection DB + khoá dòng outbox. Lỗi trả về là ActiveMQAddressFullException → OutboxPublisher coi là broker lỗi,
# bản ghi giữ PENDING và được gửi lại khi broker có chỗ — không mất message nhờ outbox, nên không cần broker giữ hộ.
addressSettings."order.placed".addressFullMessagePolicy=FAIL

# DLQ riêng, tạo sẵn cả address lẫn queue: dead-letter address không có queue thì broker BỎ message.
addressConfigurations."DLQ.order-placed".routingTypes=ANYCAST
addressConfigurations."DLQ.order-placed".queueConfigs."DLQ.order-placed".address=DLQ.order-placed
addressConfigurations."DLQ.order-placed".queueConfigs."DLQ.order-placed".routingType=ANYCAST
# Listener của DLQ lỗi (vd. DB chết) thì thử lại mãi, giãn dần tới 5 phút. Không khai báo thì kế thừa "#" (10 lần,
# không chờ) và message bị đẩy tiếp sang queue DLQ chung không ai đọc.
addressSettings."DLQ.order-placed".maxDeliveryAttempts=-1
addressSettings."DLQ.order-placed".redeliveryDelay=5000
addressSettings."DLQ.order-placed".redeliveryMultiplier=2.0
addressSettings."DLQ.order-placed".maxRedeliveryDelay=300000
