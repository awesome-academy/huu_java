<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Admin F&B">Admin Dashboard</title>
    <!-- Token CSRF cho fetch() và frame CONNECT của STOMP (static/js/realtime.js) -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/css/all.min.css}">

    <link rel="stylesheet" th:href="@{/css/admin/style.css}">
</head>
<!-- Realtime (static/js/admin/realtime.js): URL theo context path, đích STOMP = StompDestinations.ADMIN_ORDERS -->
<body class="d-flex"
      th:data-ws-url="@{/ws-stomp}"
      th:data-csrf-token-url="@{/csrf-token}"
      data-admin-orders-destination="/topic/admin/orders"
      th:data-orders-url="@{/admin/orders}"
      th:data-pending-count-url="@{/admin/orders/pending-count}">

<div class="sidebar d-flex flex-column" style="width: 250px;">
    <div class="text-center py-4 fs-4 fw-bold border-bottom border-secondary">
        <i class="fa-solid fa-burger text-warning"></i> F&B Admin
    </div>
    <div class="nav flex-column mt-3">
        <a th:href="@{/admin/dashboard}"
           th:classappend="${currentPath == '/admin' || currentPath == '/admin/' || currentPath == '/admin/dashboard'} ? ' active'">
            <i class="fa-solid fa-chart-pie me-2"></i> Dashboard
        </a>

        <a th:href="@{/admin/categories}"
           th:classappend="${#strings.startsWith(currentPath, '/admin/categories')} ? ' active'">
            <i class="fa-solid fa-tags me-2"></i> Manage Categories
        </a>

        <a th:href="@{/admin/products}"
           th:classappend="${#strings.startsWith(currentPath, '/admin/products')} ? ' active'">
            <i class="fa-solid fa-box-open me-2"></i> Manage Products
        </a>

        <a th:href="@{/admin/orders}"
           th:classappend="${#strings.startsWith(currentPath, '/admin/orders')} ? ' active'">
            <i class="fa-solid fa-cart-shopping me-2"></i> Manage Orders
            <!-- Số đơn chờ xác nhận: PendingOrderCountInterceptor, cập nhật realtime bằng realtime.js -->
            <span id="pendingOrderBadge" class="badge rounded-pill bg-danger ms-1" title="Đơn chờ xác nhận"
                  th:text="${pendingOrderCount}"
                  th:hidden="${pendingOrderCount == null || pendingOrderCount == 0}">0</span>
        </a>

        <a th:href="@{/admin/users}"
           th:classappend="${#strings.startsWith(currentPath, '/admin/users')} ? ' active'">
            <i class="fa-solid fa-users me-2"></i> Manage Users
        </a>

        <a th:href="@{/admin/suggestions}"
           th:classappend="${#strings.startsWith(currentPath, '/admin/suggestions')} ? ' active'">
            <i class="fa-solid fa-comment-dots me-2"></i> User Suggestions
        </a>
    </div>
</div>

<div class="content-area d-flex flex-column">
    <nav class="navbar navbar-admin navbar-expand px-4 py-2 mb-4 rounded d-flex justify-content-end">
        <div class="dropdown">
            <button class="btn btn-light dropdown-toggle border" type="button" data-bs-toggle="dropdown">
                <i class="fa-solid fa-user-shield me-1"></i>
                <span th:text="${#authentication.name}">Admin User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#"><i class="fa-solid fa-gear me-2"></i> Settings</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="dropdown-item text-danger">
                            <i class="fa-solid fa-right-from-bracket me-2"></i> Sign out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </nav>

    <main layout:fragment="content">
    </main>

    <footer class="mt-auto text-center text-muted py-3">
        <small>&copy; 2026 Foods & Drinks System. Crafted with Spring Boot.</small>
    </footer>
</div>

<!-- Toast thông báo realtime (đơn mới) — nội dung do realtime.js tạo bằng textContent -->
<div id="adminToastContainer" class="toast-container position-fixed bottom-0 end-0 p-3"
     aria-live="polite" aria-atomic="false"></div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/stomp__stompjs/bundles/stomp.umd.min.js}"></script>
<script th:src="@{/js/realtime.js}"></script>

<script th:src="@{/js/admin/main.js}"></script>
<script th:src="@{/js/admin/realtime.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
