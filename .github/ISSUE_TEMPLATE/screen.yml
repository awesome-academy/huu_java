name: Tính năng
description: Một màn hình hoặc tính năng trong scope của project
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: phase
    attributes:
      label: Roadmap phase
      description: Theo CLAUDE.md, mục "Lộ trình Advance → Giai đoạn"
      options:
        - 0. Hạ tầng (Docker)
        - 1. Logging (Logback, MDC, audit log)
        - 2. Security hardening (OWASP)
        - 3. Testing (Mockito, WebMvcTest, Testcontainers)
        - 4. Scheduler & Multithread
        - 5. JMS (ActiveMQ Artemis)
        - 6. WebSocket + STOMP + Chart
        - 7. Excel import/export (Apache POI)
        - 8. SOAP (Spring-WS) + Tổng kết
    validations:
      required: true
  - type: dropdown
    id: feature-type
    attributes:
      label: Loại tính năng
      multiple: true
      options:
        - Màn hình Admin (Thymeleaf)
        - Màn hình Storefront (Thymeleaf)
        - REST API
        - Scheduler / Async / Multithread
        - JMS
        - WebSocket + Chart
        - Excel import/export
        - SOAP WebService
        - Security
        - Logging
    validations:
      required: true
  - type: input
    id: feature-code
    attributes:
      label: Mã màn / tính năng
      description: "vd: SCR001 / F001 — để trống nếu chưa có"
  - type: input
    id: reference
    attributes:
      label: Tài liệu / yêu cầu liên quan
      description: Link tài liệu yêu cầu, thiết kế (nếu có)
  - type: textarea
    id: description
    attributes:
      label: Mô tả
      description: Tính năng làm gì, cho ai dùng
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Tiêu chí chấp nhận
      description: Mỗi dòng một điều kiện kiểm tra được
      placeholder: |
        - Admin bấm "Export Excel" ở /admin/orders → tải file .xlsx gồm đúng các đơn theo bộ lọc
        - User không phải admin gọi /admin/orders/export → 403
        - Có đơn mới → trang /admin nhận thông báo realtime qua WebSocket, chart tự cập nhật
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Ai được truy cập
      multiple: true
      options:
        - Khách (chưa đăng nhập)
        - User (ROLE_USER)
        - Admin (ROLE_ADMIN)
        - API client (JWT)
        - Hệ thống / đối tác (SOAP)
        - Không áp dụng (chạy ngầm)
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Ghi chú kỹ thuật
      description: Entity/bảng, Flyway migration, endpoint, queue/topic, biến môi trường mới (.env.example), service Docker mới, rủi ro đã biết
  - type: input
    id: estimate
    attributes:
      label: Estimate (giờ)
      placeholder: "3"
    validations:
      required: true
  - type: checkboxes
    id: dod
    attributes:
      label: Definition of Done
      description: Tick dần khi làm — không cần tick lúc tạo issue
      options:
        - label: Logic đúng tiêu chí chấp nhận
        - label: Unit test (JUnit 5 + Mockito), Controller test (MockMvc)
        - label: Test bảo mật (401 / 403 / thiếu CSRF / IDOR / 400)
        - label: Đạt checklist OWASP (CLAUDE.md, mục "OWASP Secure Coding")
        - label: Flyway migration (nếu đổi DB)
        - label: Swagger/OpenAPI cập nhật (nếu đổi API)
        - label: Cập nhật docs/admin, docs/web, docs/api, README, .env.example (nếu liên quan)
        - label: Tick giai đoạn trong CLAUDE.md, mục "Lộ trình Advance → Giai đoạn" (nếu hoàn thành giai đoạn)
