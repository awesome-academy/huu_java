# Chạy toàn bộ trong Docker, không cần JDK/Maven/MySQL trên máy:
#   docker compose up -d --build                 # MySQL + Artemis + app (http://localhost:8080)
#   docker compose run --rm maven-docker test    # Toàn bộ test (Testcontainers, mount Docker socket — xem cảnh báo)
#   docker compose run --rm maven <goal>         # Lệnh Maven bất kỳ trong container JDK 25 (không có Docker socket)
#   docker compose up -d mysql artemis           # Chỉ hạ tầng, app chạy bằng JDK local
#   docker compose --profile multi up -d --build # 2 instance app + nginx không sticky (http://localhost:8088)
# Biến môi trường lấy từ file .env (copy từ .env.example). Compose này chỉ dành cho môi trường LOCAL:
# mọi port chỉ bind 127.0.0.1.

# Cấu hình dùng chung cho app và maven — trong mạng Docker dùng tên service + port nội bộ.
# env_file truyền toàn bộ .env vào container (OAuth, mail, Slack, JWT...); các biến dưới đây ghi đè giá trị trong .env.
x-app-common: &app-common
  env_file: .env
  environment: &app-env
    DB_FOODSNDRINKS_URL: jdbc:mysql://mysql:3306/${DB_NAME:-foodsndrinks}?serverTimezone=UTC
    ARTEMIS_HOST: artemis
    ARTEMIS_PORT: 61616
    # @CreationTimestamp / LocalDateTime.now() dùng múi giờ JVM — lấy từ APP_TZ trong .env để mọi instance chung một múi giờ,
    # truyền vào container dưới tên TZ (biến JVM đọc). Thiếu biến thì dùng giờ VN (giống default của image app;
    # service maven dùng image eclipse-temurin gốc, mặc định UTC).
    TZ: ${APP_TZ:-Asia/Ho_Chi_Minh}

services:
  mysql:
    image: mysql:8.4
    container_name: foodsndrinks-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-foodsndrinks}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Cố định UTC cho khớp serverTimezone=UTC trong JDBC URL: driver đổi mọi thời gian app ghi (orderedAt,
      # @CreationTimestamp/@UpdateTimestamp) từ múi giờ JVM (APP_TZ) sang UTC trước khi gửi, nên DB lưu thống nhất
      # theo UTC. KHÔNG đặt TZ/APP_TZ cho service này: session lệch UTC thì cột TIMESTAMP bị lưu lệch giờ.
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-33070}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # Ping qua TCP (127.0.0.1) thay vì socket: lúc khởi tạo lần đầu MySQL chạy server tạm với --skip-networking,
      # ping qua socket sẽ báo healthy quá sớm khiến app bị "Connection refused"
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Broker JMS (ActiveMQ Artemis) của container app (ARTEMIS_MODE=native). App chạy bằng JDK local mặc định dùng broker
  # embedded; muốn nối broker này thì đặt ARTEMIS_MODE=native + ARTEMIS_EMBEDDED_ENABLED=false trong .env.
  # Version trùng artemis.version trong pom.xml (client). Từ 2.50 image đổi tên apache/activemq-artemis → apache/artemis.
  artemis:
    image: apache/artemis:2.57.0
    container_name: foodsndrinks-artemis
    environment:
      ARTEMIS_USER: ${ARTEMIS_USER:?ARTEMIS_USER is required}
      ARTEMIS_PASSWORD: ${ARTEMIS_PASSWORD:?ARTEMIS_PASSWORD is required}
    # Address/retry/DLQ: cùng file với broker embedded, nạp lại MỖI lần khởi động. Không dùng thư mục etc-override của
    # image: image chỉ chép nó khi tạo instance lần đầu, volume artemis-instance đã có thì bỏ qua (sửa file không có tác dụng).
    command: ["run", "--properties", "/opt/foodsndrinks/broker.properties"]
    ports:
      - "127.0.0.1:${ARTEMIS_PORT:-61616}:61616"           # JMS (core / OpenWire / AMQP)
      - "127.0.0.1:${ARTEMIS_CONSOLE_PORT:-8161}:8161"     # Web console
    volumes:
      # Volume mới (không dùng lại artemis-data): instance tạo bằng image apache/activemq-artemis cũ trỏ ARTEMIS_HOME tới
      # /opt/activemq-artemis, không còn trong image apache/artemis. Volume artemis-data cũ có thể xoá
      # (docker volume ls | grep artemis-data, rồi docker volume rm <tên>).
      - artemis-instance:/var/lib/artemis-instance
      - ./src/main/resources/artemis/broker.properties:/opt/foodsndrinks/broker.properties:ro

  app:
    <<: *app-common
    build: .
    image: foodsndrinks:local
    container_name: foodsndrinks-app
    # Chạy bằng UID/GID của user máy host (không phải root): uploads/ và logs/ là bind mount thuộc user máy host,
    # user `spring` của image (UID hệ thống ~999) không ghi được trên Linux/WSL2. File container ghi ra vẫn thuộc user máy host.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      <<: *app-env
      # Compose dùng cho môi trường local → mặc định profile dev (bật Swagger, log DEBUG)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      UPLOAD_DIR: /app/uploads
      # File Excel đang chờ import (service/excel/ImportFileStorage) — KHÔNG nằm trong uploads/ (public tại /uploads/**)
      EXCEL_IMPORT_DIR: /app/import-tmp
      # Dùng broker của service artemis (không chạy broker embedded trong container). Cần cả hai biến: Boot 4 tạo broker
      # embedded theo ARTEMIS_EMBEDDED_ENABLED, không xét mode. Không đặt ở x-app-common: container maven chạy test
      # luôn dùng broker embedded.
      ARTEMIS_MODE: native
      ARTEMIS_EMBEDDED_ENABLED: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      # Dùng chung thư mục uploads/ của project (có sẵn ảnh mặc định default-food.png, default-avatar.png).
      # logs/ có sẵn trong repo (logs/.gitignore) để Docker không tự tạo nó thuộc root.
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      # import-tmp/ có sẵn trong repo (import-tmp/.gitignore) để Docker không tự tạo nó thuộc root. Chạy nhiều instance
      # app thì mọi instance phải mount CÙNG thư mục này: instance nhận upload và instance xử lý message có thể khác nhau.
      - ./import-tmp:/app/import-tmp
    depends_on:
      mysql:
        condition: service_healthy
      artemis:
        condition: service_started
    # Mặc định Docker chờ 10s sau SIGTERM rồi SIGKILL — ngắn hơn graceful shutdown của app (request đang chạy +
    # executor chờ task, mỗi phase tối đa 30s — spring.lifecycle / spring.task.*.shutdown trong application.yml).
    stop_grace_period: 60s

  # ----- Profile "multi": kiểm chứng chạy NHIỀU INSTANCE sau load balancer KHÔNG sticky (README, mục Realtime) -----
  #   docker compose --profile multi up -d --build      → http://localhost:8088 (LB_PORT), round-robin giữa app và app2
  # Hai instance dùng chung MySQL (session HTTP nằm trong bảng SPRING_SESSION — đăng nhập ở instance này, request kế
  # tiếp sang instance kia vẫn đăng nhập), broker Artemis, uploads/ và import-tmp/. Instance thứ hai giống hệt `app`, chỉ
  # khác: không mở port ra host (đi qua `lb`), INSTANCE_ID riêng (in trong mỗi dòng log) và thư mục log riêng — hai JVM
  # không bao giờ được ghi/xoay vòng chung một file log.
  app2:
    extends:
      service: app
    profiles: ["multi"]
    container_name: foodsndrinks-app2
    environment:
      INSTANCE_ID: app2
      # logback-spring.xml: thư mục file log (mặc định logs/) → /app/logs/app2 trong cùng bind mount ./logs
      LOG_PATH: logs/app2
    ports: !reset []
    # depends_on không được kế thừa qua extends
    depends_on:
      mysql:
        condition: service_healthy
      artemis:
        condition: service_started

  # Load balancer của profile "multi": nginx round-robin, KHÔNG sticky (docker/nginx-multi.conf). Chỉ để kiểm chứng ở
  # local — app chạy profile dev nên không đọc X-Forwarded-For: mọi client có chung IP của nginx (bộ đếm đăng nhập sai
  # theo IP gộp lại). Prod: bật forward headers + TRUSTED_PROXIES (README).
  lb:
    image: nginx:1.28-alpine
    profiles: ["multi"]
    container_name: foodsndrinks-lb
    ports:
      - "127.0.0.1:${LB_PORT:-8088}:80"
    volumes:
      - ./docker/nginx-multi.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - app2

  # Container JDK 25 để chạy lệnh Maven (compile, package, dependency-check...) mà không cần cài JDK local.
  # Chỉ chạy khi gọi: docker compose run --rm maven <goal>
  # Không mount Docker socket: code của dependency/plugin chạy trong build không điều khiển được Docker của host. Vì vậy
  # service này chỉ chạy được test không cần Docker (unit test, @WebMvcTest: test -DexcludedGroups=integration); toàn bộ test
  # (@IntegrationTest dùng MySQL của Testcontainers) chạy bằng service maven-docker bên dưới hoặc ./mvnw test trên máy.
  # Chạy Maven bằng đúng chủ sở hữu thư mục project (tự nhận diện, không cần HOST_UID) — xem docker/maven-entrypoint.sh:
  # Linux/WSL2 thì target/ và mọi file test ghi ra thuộc user máy host ngay từ đầu, không cần chown sau khi chạy.
  # UID của user máy host không có trong /etc/passwd của image nên đặt HOME, MAVEN_USER_HOME (mvnw tải Maven vào
  # /m2/wrapper) và maven.repo.local trỏ vào volume maven-repo ở /m2.
  maven:
    <<: *app-common
    image: eclipse-temurin:25-jdk
    profiles: ["tools"]
    working_dir: /workspace
    environment:
      <<: *app-env
      HOME: /m2
      MAVEN_USER_HOME: /m2
      MAVEN_OPTS: -Duser.home=/m2 -Dmaven.repo.local=/m2/repository
    # Gọi qua sh: script và mvnw trong git không có quyền thực thi (mode 100644)
    entrypoint: ["sh", "docker/maven-entrypoint.sh"]
    command: ["package", "-DskipTests"]
    volumes:
      - .:/workspace
      - maven-repo:/m2

  # Như service maven + Docker socket của host, để Testcontainers tạo container MySQL cho integration test:
  #   docker compose run --rm maven-docker test
  #   docker compose run --rm maven-docker test -Dtest=AuthProductApiTest
  # ⚠ RỦI RO: ai điều khiển được Docker socket thì có quyền root trên máy host. Mọi code chạy trong build (dependency,
  # plugin Maven, test) đều dùng được socket này — chỉ chạy trên máy dev với dependency đã tin cậy, KHÔNG dùng cho code
  # chưa review (vd. PR lạ) hay trên CI dùng chung. Có JDK 25 + Docker trên máy thì dùng ./mvnw test thay thế.
  # Testcontainers tự nhận ra đang chạy trong container và nối tới cổng MySQL qua gateway của mạng Docker. Entrypoint
  # (Linux/WSL2) giữ group sở hữu socket khi hạ quyền về user máy host — xem docker/maven-entrypoint.sh.
  maven-docker:
    extends:
      service: maven
    command: ["test"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  # Unit test JS (src/test/js, test runner có sẵn của Node — không npm, không node_modules): nạp từng file static/js vào
  # một context vm với DOM/STOMP giả. Mount chỉ đọc, không mạng.
  #   docker compose run --rm js-test
  js-test:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /workspace
    network_mode: none
    command: ["node", "--test", "src/test/js/**/*.test.mjs"]
    volumes:
      - .:/workspace:ro

volumes:
  mysql-data:
  artemis-instance:
  maven-repo:
