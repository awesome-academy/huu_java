# Load balancer của profile "multi" trong docker-compose.yaml (chỉ dùng ở local):
#   docker compose --profile multi up -d --build   →   http://localhost:8088
#
# Round-robin KHÔNG sticky (không ip_hash, không cookie): hai request liên tiếp của cùng một trình duyệt tới hai instance
# khác nhau. App chạy đúng vì session HTTP nằm trong MySQL (Spring Session JDBC) và sự kiện realtime đi qua topic JMS.

upstream foodsndrinks {
    server app:8080;
    server app2:8080;
}

# Handshake WebSocket (/ws-stomp) cần Upgrade + Connection: upgrade; request thường thì không giữ kết nối tới upstream
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # Bằng spring.servlet.multipart.max-request-size của app (mặc định của nginx là 1m — upload ảnh/Excel sẽ bị 413)
    client_max_body_size 25m;

    location / {
        proxy_pass http://foodsndrinks;
        proxy_http_version 1.1;

        # Giữ nguyên Host (kèm cổng): app dựng URL redirect từ nó, và kiểm tra same-origin của WebSocket so Origin của
        # trình duyệt với Host này
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Phải lớn hơn 2 × heartbeat STOMP (app.websocket.heartbeat = 10s), không thì socket rảnh bị nginx cắt
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
